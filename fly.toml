# fly.toml app configuration file generated for siraat on 2026-09-17T09:50:48+05:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'siraat'
primary_region = 'sin'

[build]
  dockerfile = 'apps/backend/Dockerfile'

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpus = 1
  memory_mb = 1024
