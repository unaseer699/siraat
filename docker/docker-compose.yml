version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: siraat-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: siraat
      POSTGRES_PASSWORD: siraat_local_dev
      POSTGRES_DB: siraat
    ports:
      - "5432:5432"
    volumes:
      - siraat_pg_data:/var/lib/postgresql/data
      - ./init-schemas.sql:/docker-entrypoint-initdb.d/init-schemas.sql

  redis:
    image: redis:7-alpine
    container_name: siraat-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:latest
    container_name: siraat-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: siraat_minio
      MINIO_ROOT_PASSWORD: siraat_minio_dev
    ports:
      - "9000:9000"   # S3 API (stand-in for DO Spaces)
      - "9001:9001"   # Web console
    volumes:
      - siraat_minio_data:/data

volumes:
  siraat_pg_data:
  siraat_minio_data:
